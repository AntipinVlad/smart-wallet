name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push cancels the run for the old commit
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run mypy

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Same image and settings as db-test in docker-compose.yml
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wallet
          POSTGRES_DB: finance_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet -d finance_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql+psycopg://wallet@127.0.0.1:5432/finance_test

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true

      # --locked: fail if uv.lock is out of date instead of updating it
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -W error
