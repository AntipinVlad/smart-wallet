[project]
name = "smart-wallet"
version = "1.3.1"
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.14.5",
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "fastapi-pagination[sqlalchemy]==0.16.2",
    "openai==3.46.0",
    "psycopg[binary]==3.3.6",
    "pwdlib[argon2]==0.3.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.2",
    "pyjwt==2.15.1",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.1.6",
    "taskiq==0.13.0",
    "taskiq-redis==1.2.4",
    "tzdata==2026.6",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle: basic style errors
    "F",        # pyflakes: unused imports and variables, undefined names
    "I",        # isort: import order
    "B",        # flake8-bugbear: likely bugs
    "UP",       # pyupgrade: newer syntax for the target Python version
    "SIM",      # flake8-simplify
    "C4",       # flake8-comprehensions
    "ASYNC",    # flake8-async: blocking calls inside async code
    "S",        # flake8-bandit: security
    "RUF",      # ruff-specific rules
]
ignore = [
    # Hardcoded passwords: matches only names, so every "token" constant is reported. Secrets come from env
    "S105", "S106",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI and taskiq read their Depends() and Query() from default arguments by design
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "taskiq.TaskiqDepends"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks results
"tests/**" = ["S101"]
# conftest sets environment variables before importing the app
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
source = ["app"]
branch = true
# Async SQLAlchemy runs code after await in greenlets: without this coverage loses those lines
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
